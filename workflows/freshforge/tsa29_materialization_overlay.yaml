instance:
  root: external/femic-tsa29-instance
  submodule_path: external/femic-tsa29-instance
environment:
  venv_path: .venv
install:
  extras:
    - dev
    - freshforge
  requirements: []
  editable_paths:
    - external/femic-tsa29-instance
  packages: []
annex:
  enabled: true
  special_remote: arbutus-s3
materialization:
  required_paths:
    - models/tsa29_patchworks_model/blocks
    - models/tsa29_patchworks_model/tracks
    - models/tsa29_patchworks_model/analysis
    - output/patchworks_tsa29_validated
    - config
    - workflows
audit:
  required_paths:
    - models/tsa29_patchworks_model/blocks
    - models/tsa29_patchworks_model/tracks
    - models/tsa29_patchworks_model/analysis
    - output/patchworks_tsa29_validated
report:
  path: runtime/freshforge/tsa29_materialization_report.json
